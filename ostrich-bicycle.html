  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #d7f1fb;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .feather {
      transform-box: view-box;
      animation: flutter 0.48s ease-in-out infinite alternate;
    }
    .f1 { transform-origin: 430px 205px; animation-duration: 0.42s; }
    .f2 { transform-origin: 445px 230px; animation-duration: 0.55s; animation-delay: -0.12s; }
    .f3 { transform-origin: 450px 258px; animation-duration: 0.46s; animation-delay: -0.28s; }
    .f4 { transform-origin: 460px 278px; animation-duration: 0.6s; animation-delay: -0.05s; }
    .tip {
      transform-box: view-box;
      transform-origin: 620px 230px;
      animation: flutter 0.7s ease-in-out infinite alternate;
    }
    .puff {
      transform-box: fill-box;
      transform-origin: center;
      animation: puff 0.85s linear infinite;
    }
    .p2 { animation-delay: -0.28s; }
    .p3 { animation-delay: -0.56s; }
    @keyframes flutter {
      from { transform: rotate(-7deg); }
      to { transform: rotate(8deg); }
    }
    @keyframes puff {
      0% { transform: translate(0, 0) scale(0.55); opacity: 0; }
      18% { opacity: 0.55; }
      100% { transform: translate(-78px, -18px) scale(1.35); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feather, .tip, .puff { animation: none; }
    }
  </style>
</head>

  <script>
    const $ = (id) => document.getElementById(id);
    const BB = { x: 545, y: 458 };
    const CRANK = 44;
    const WHEEL_R = 78;
    const SPEED = 380;
    const CADENCE = (Math.PI * 2) / 1.25;
    const legs = {
      near: { hip: { x: 520, y: 300 }, thigh: 86, shin: 122, bend: 1, w0: 32, w1: 16, s0: 16, s1: 11 },
      far: { hip: { x: 498, y: 292 }, thigh: 90, shin: 128, bend: 1, w0: 24, w1: 14, s0: 14, s1: 10 },
    };

    const farGraphic = document.getElementById("foot").cloneNode(true);
    farGraphic.removeAttribute("id");
    $("farFoot").appendChild(farGraphic);

    function limb(x1, y1, x2, y2, w1, w2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const px = -dy / len;
      const py = dx / len;
      const a = w1 / 2;
      const b = w2 / 2;
      return `M${(x1 + px * a).toFixed(1)} ${(y1 + py * a).toFixed(1)} L${(x2 + px * b).toFixed(1)} ${(y2 + py * b).toFixed(1)} L${(x2 - px * b).toFixed(1)} ${(y2 - py * b).toFixed(1)} L${(x1 - px * a).toFixed(1)} ${(y1 - py * a).toFixed(1)} Z`;
    }

    function solveKnee(hip, target, l1, l2, bend) {
      let dx = target.x - hip.x;
      let dy = target.y - hip.y;
      let dist = Math.hypot(dx, dy) || 1;
      const max = l1 + l2 - 1;
      const min = Math.abs(l1 - l2) + 1;
      if (dist > max) {
        dx *= max / dist;
        dy *= max / dist;
        dist = max;
      } else if (dist < min) {
        dx *= min / dist;
        dy *= min / dist;
        dist = min;
      }
      const aim = Math.atan2(dy, dx);
      const cos = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
      const kneeA = Math.acos(Math.max(-1, Math.min(1, cos)));
      return {
        kx: hip.x + Math.cos(aim + bend * kneeA) * l1,
        ky: hip.y + Math.sin(aim + bend * kneeA) * l1,
        tx: hip.x + dx,
        ty: hip.y + dy,
      };
    }

    function scales(x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const px = -uy;
      const py = ux;
      let d = "";
      for (const t of [0.32, 0.52, 0.72]) {
        const x = x1 + dx * t;
        const y = y1 + dy * t;
        d += `M${(x - px * 6).toFixed(1)} ${(y - py * 6).toFixed(1)} Q${(x + ux * 5).toFixed(1)} ${(y + uy * 5).toFixed(1)} ${(x + px * 6).toFixed(1)} ${(y + py * 6).toFixed(1)}`;
      }
      return d;
    }

    function blinkScale(time) {
      const p = time % 5.2;
      const pulse = (start, dur) => {
        if (p < start || p > start + dur) return 0;
        return Math.sin(((p - start) / dur) * Math.PI);
      };
      return Math.max(pulse(4.05, 0.16), pulse(4.32, 0.12));
    }

    function placeLeg(name, angle) {
      const spec = legs[name];
      const pedal = {
        x: BB.x + Math.cos(angle) * CRANK,
        y: BB.y + Math.sin(angle) * CRANK,
      };
      const knee = solveKnee(spec.hip, { x: pedal.x, y: pedal.y - 13 }, spec.thigh, spec.shin, spec.bend);
      $(name + "Thigh").setAttribute("d", limb(spec.hip.x, spec.hip.y, knee.kx, knee.ky, spec.w0, spec.w1));
      $(name + "Shin").setAttribute("d", limb(knee.kx, knee.ky, knee.tx, knee.ty, spec.s0, spec.s1));
      $(name + "Knee").setAttribute("cx", knee.kx.toFixed(1));
      $(name + "Knee").setAttribute("cy", knee.ky.toFixed(1));
      $(name + "Foot").setAttribute("transform", `translate(${knee.tx.toFixed(1)} ${knee.ty.toFixed(1)})`);
      if (name === "near") $("nearScales").setAttribute("d", scales(knee.kx, knee.ky, knee.tx, knee.ty));
    }

    function render(time) {
      const angle = time * CADENCE;
      const dist = time * SPEED;
      const wheel = (dist / WHEEL_R) * 180 / Math.PI;
      const deg = angle * 180 / Math.PI;
      $("rearSpin").setAttribute("transform", `rotate(${wheel.toFixed(2)})`);
      $("frontSpin").setAttribute("transform", `rotate(${wheel.toFixed(2)})`);
      $("farCrank").setAttribute("transform", `translate(${BB.x} ${BB.y}) rotate(${deg.toFixed(2)})`);
      $("nearCrank").setAttribute("transform", `translate(${BB.x} ${BB.y}) rotate(${deg.toFixed(2)})`);
      $("farLevel").setAttribute("transform", `rotate(${(-deg).toFixed(2)})`);
      $("nearLevel").setAttribute("transform", `rotate(${(-deg).toFixed(2)})`);
      $("chainring").setAttribute("transform", `translate(${BB.x} ${BB.y}) rotate(${deg.toFixed(2)})`);
      placeLeg("far", angle + Math.PI);
      placeLeg("near", angle);
      const bob = Math.sin(angle * 2) * 3.2;
      $("rider").setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
      const lifted = Math.max(0, -bob) / 3.2;
      $("shadow").setAttribute("opacity", (0.13 - lifted * 0.04).toFixed(3));
      $("shadow").setAttribute("rx", (250 - lifted * 16).toFixed(1));
      $("neckGroup").setAttribute("transform", `rotate(${(Math.sin(angle * 2) * 2.2).toFixed(2)} 540 248)`);
      $("wing").setAttribute("transform", `rotate(${(Math.sin(angle * 2 + 0.6) * 1.4).toFixed(2)} 560 250)`);
      $("lid").setAttribute("transform", `scale(1 ${(0.06 + blinkScale(time) * 0.94).toFixed(3)})`);
      $("hillLayer").setAttribute("transform", `translate(${-(dist * 0.45 % 1200)} 0)`);
      $("cloudLayer").setAttribute("transform", `translate(${-(dist * 0.22 % 1200)} 0)`);
      $("groundLayer").setAttribute("transform", `translate(${-(dist % 800)} 0)`);
    }

    const params = new URLSearchParams(location.search);
    const freeze = params.has("t") ? Number(params.get("t")) : null;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    render(freeze ?? 0.35);
    if (freeze === null && !reduce) {
      let start = 0;
      const loop = (now) => {
        if (!start) start = now;
        render((now - start) / 1000);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
