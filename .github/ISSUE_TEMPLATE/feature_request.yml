name: 功能建议 / Feature request
description: 建议可复用的新能力或工作流改进 / Propose a reusable capability or workflow improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题与使用场景 / User problem and use case
      description: 描述当前无法可靠完成的任务 / Describe the task that cannot be completed reliably today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为 / Proposed behavior
      description: 说明期望的输入、行为和可验证输出 / Describe the expected input, behavior, and verifiable output
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives considered
    validations:
      required: true
  - type: textarea
    id: fidelity
    attributes:
      label: 保真度与可编辑性影响 / Fidelity and editability impact
      description: 说明该建议如何保持或改变两项核心要求 / Explain how the proposal preserves or changes both core requirements
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认 / Scope confirmation
      options:
        - label: 该建议不依赖未经授权的素材、访问方式或第三方账户操作。 / This request does not depend on unauthorized material, access, or third-party account operations.
          required: true
